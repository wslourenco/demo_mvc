spring.application.name=demo-mvc

#PORT
server.port=8080

# Configuração de porta para evitar conflito
#server.port=8081

# Para ver quem está ocupando a porta 8080, e finalizar o processo
# netstat -ano | findstr :8080
# taskkill /PID <PID_encontrado> /F


#MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/demo_mvc?createDatabaseIfNotExist=True&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.connections.pooling=WARN

#THYMELEAF
spring.thymeleaf.cache = false









