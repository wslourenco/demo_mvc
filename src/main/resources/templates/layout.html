<!doctype html>
<html
  lang="pt"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
  <head>
    <title>Spring-Boot</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <link rel="icon" href="/image/favicon.png" />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Custom styles for this template -->
    <link href="/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <header th:replace="~{fragments/header :: cabecalho}">
      <div>header</div>
    </header>

    <div class="layout-main">
      <aside>
        <nav th:replace="~{fragments/sidebar :: nav-sidebar}">
          <span>menu</span>
        </nav>
      </aside>

      <section layout:fragment="corpo">
        <div>conteúdo principal das páginas</div>
      </section>
    </div>

    <footer th:replace="~{fragments/footer :: rodape}">
      <div>footer</div>
    </footer>

    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('[data-bs-toggle="popover"]').forEach(function (el) {
          new bootstrap.Popover(el);
        });

        document.querySelectorAll(".navbar-toggle").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var sidebar = document.querySelector(".sidebar");
            if (sidebar) {
              sidebar.classList.toggle("sidebar-open");
            }
          });
        });
      });
    </script>
  </body>
</html>
